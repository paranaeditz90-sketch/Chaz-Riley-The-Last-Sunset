<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>The Last Sunset</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0b10; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
    #game { position: fixed; inset: 0; }
    #girar { display: none; position: fixed; inset: 0; z-index: 9; align-items: center; justify-content: center;
             background: #0d0b10; color: #fff3d6; font: 600 22px "Trebuchet MS", Verdana, sans-serif; text-align: center; padding: 16px; }
    @media (orientation: portrait) and (pointer: coarse) { #girar { display: flex; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="girar">Vire o celular na horizontal ↻</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
